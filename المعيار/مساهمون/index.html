<script src="../../assets/util.js"></script>
<script>
(function(){
  "use strict";

  async function loadData(){
    try {
      const res = await fetch("../../data/results.json", { cache: "no-store" });
      if (!res.ok) throw new Error(String(res.status));
      return await res.json();
    } catch (e) {
      return JSON.parse(document.getElementById("results-data").textContent);
    }
  }

  loadData().then(data => {
    document.getElementById("v").textContent = "v" + data.version;
    document.getElementById("d").textContent = data.updated || "لم يُحدَّث بعد";
    const contributors = data.contributors || [];
    document.getElementById("n").textContent = contributors.length;

    const out = document.getElementById("out");
    if (!contributors.length) {
      out.innerHTML = '<p class="empty">لا مساهمين مسجّلين بعد. أول ظهور هنا يكون عند نشر أول طلب تقييم أو أول تشغيلة قياس.</p>';
      return;
    }
    let rows = contributors.map(c =>
      "<tr><td>" + MiqyasUtil.escapeHtml(c.name) + '</td><td class="num">' + (c.prompts_authored || 0)
      + '</td><td class="num">' + (c.runs_submitted || 0)
      + "</td><td>" + MiqyasUtil.escapeHtml(c.first_contribution || "—") + "</td></tr>"
    ).join("");
    out.innerHTML = '<table class="data-table"><thead><tr>'
      + "<th>الاسم</th><th>طلبات كتبها</th><th>تشغيلات أرسلها</th><th>أول مساهمة</th>"
      + "</tr></thead><tbody>" + rows + "</tbody></table>";
  });
})();
</script>
</body>
</html>
