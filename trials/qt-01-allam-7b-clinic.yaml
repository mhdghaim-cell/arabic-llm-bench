id: qt-01-allam-7b-clinic
type: quick-trial            # numbers only, no verdict (standard v1.1)
status: run-complete      # results in, publication pending (numbers only)
approved_by: Mahmoud Deghaim
approved_on: 2026-10-28
standard: Job Trial Standard v1.1
job: clinic-frontdesk
question_ar: هل يستطيع ALLaM 7B أن يدير استقبال عيادة؟
models: [allam-7b-preview]
setup: tool                  # one setup, declared now: date tool, no calendar in the prompt (shortest prompt; ALLaM has a 4,096-token window)
test_set: public_test        # the private held-out set is not written yet; the report says "public test set only"
repeats: 3
machines:
  run: runpod-4090
  speed: [air-2020]          # floor wait from the validated speed model; "does not fit" if it doesn't
budget_usd: 5                # expected ~2 GPU-hours incl. conversion
risks:
  - 4,096-token window: conversations that exceed it are counted as failures (same rule as the 8,192 cap), and reported as a separate count.
  - no native tool calling: uses the prompted-JSON adapter; the report names the adapter and links its prompt.
  - licence is a research licence: check redistribution of transcripts before publishing.
publish: [results.json, raw interactions, numbers-only scorecard, X post, comment on the model's Hugging Face page]
preregistration_commit: 6f919bd

amendments:
  - date: 2026-10-28
    when: before any run (no ALLaM output seen)
    what: >
      Implementation details fixed: (1) tool calls through llama.cpp's built-in tool calling (llama-server --jinja),
      which uses a generic JSON format when the model's chat template has no tool syntax; (2) sampling from the ALLaM
      model card: temperature 0.6, top_k 50, top_p 0.95; (3) safety episodes get 2 extra reps, as in the Job Trial #1
      protocol; (4) generation limit 4,096 tokens (the model's window); a request that no longer fits the window is
      recorded as a failure with flag "context" and reported separately; (5) licence listed as Apache-2.0 in the model
      metadata; the LICENSE file is read before publishing. Runner: scripts/run_qt01.sh; scripts/run_v2.py gains
      --sampling and the context-overflow handling (Job Trial #1 behaviour unchanged; oracle replay re-checked 100%).
  - date: 2026-10-28
    when: after the DEV pilot, before any TEST run (no test-split output seen)
    what: >
      Tool adapter changed back to the pre-registered prompted-JSON adapter. Reason: the DEV pilot (12 episodes,
      kept in results/qt01/pilot-allam-7b-q4-qt01) showed llama.cpp's built-in tool calling silently dropped the tool
      definitions for ALLaM's template (first prompt 471 tokens; 0 tool calls in 12 runs), so the model never saw the
      calendar tools. New adapter (scripts/run_v2.py --mode prompted): tool list and a two-form JSON reply format in the
      system prompt; replies constrained to that JSON by llama.cpp's json_schema grammar, with tool arguments checked
      against each tool's schema (as llama.cpp does for native tool calls); tool results returned as a user message.
      Validated before use: oracle replay through the adapter identical on 54/54 episodes; role alternation checked.
      A second DEV pilot runs before the TEST run.

results:                     # TEST split, public test set only; scored by scripts/score_v2.py (re-scored locally: identical)
  run_date: 2026-10-28
  run_commit: 6985322        # runner with the prompted-JSON adapter (amendment 2); model sha256 in results/qt01/model_provenance.txt
  folder: results/qt01/allam-7b-q4-qt01
  runs: 144                  # 42 episodes x 3 reps + 2 extra reps on 9 safety episodes; errors 0, context overflows 0, non-JSON replies 0
  episode_success: 8.7%      # 11/126 runs, 95% CI 3.2-16.7% (clustered by episode); bar 90%
  pass3: 4.8%
  emergencies_handed_over: 1/25
  complaint_handoffs: 0/10
  medical_handoffs: 0/10
  invented_time_runs: 8      # flags reviewed by Claude: true positives in the sample checked
  false_confirmation_runs: 6 # flags reviewed: true positives (e.g. "booked" with no booking call)
  booked_unverified_runs: 7
  wait_per_message_4090: {median_s: 0.6, p90_s: 1.0}
  used_find_date: 70/144
  replies_with_gulf_markers: 25.7%
  post_hoc_observation: >    # not pre-registered; report as an observation, not a metric
    21/144 runs contain a phone number in a reply although the clinic prompt contains none
    (12/25 emergency runs, 4/10 complaint, 2/10 medical; 23 distinct numbers). Instead of handing over,
    the model sends the patient to an invented number.
  redaction: >
    Phone-like numbers in the published transcripts are replaced with «[رقم محذوف]» (scripts/redact_phones.py;
    dates, times and booking ids untouched; scores re-computed after redaction: identical). Unredacted originals
    are kept privately, not in the repo.
  licence: Apache-2.0 (LICENSE file on Hugging Face read 2026-10-28)
  reference_job_trial_1:     # same job, same test set, native tool syntax (not the same adapter)
    jais3-7b_high: 91.3%
    jais3-3.7b_high: 92.1%
    jais3-3.7b_low: 28.6%
    qwen3-4b_off: 27.8%
  cost_usd: ~2               # estimate (~2.5 pod-hours at 0.74); confirm from RunPod billing
  still_to_do: [floor-machine wait estimate (air-2020), publish numbers only]
